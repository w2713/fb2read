name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # node-pty собирается из исходников, поэтому разрешаем его сборку.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Сквозные тесты запускают собранный бандл, поэтому сборка идёт раньше.
      - run: pnpm build
      - run: pnpm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      # Читалку для браузера проверяет настоящий Chromium: подделка не покажет
      # ни сломанный Worker, ни развалившуюся кодировку.
      - run: npx playwright install --with-deps chromium
      # Собирается всё: сквозная проверка синхронизации запускает и сервер.
      - run: pnpm build
      # Единственное место, где браузерные проверки вообще выполняются: в
      # матрице `test` Chromium не ставится, и они там молча пропускаются.
      # Без этого шага тридцать с лишним проверок читалки не работали бы нигде,
      # кроме моей машины.
      # Из корня, а не из пакета: в пакете нет своего конфига, и vitest
      # подхватил бы там скомпилированные копии тестов из dist-types.
      - name: Проверить читалку в браузере
        run: pnpm exec vitest run packages/web/test
      - name: Проверить сборку под Bun
        run: |
          bun packages/cli/dist/fb2read.mjs --version
          bun packages/server/dist/fb2read-server.mjs --version
      - name: Проверить установщик на поддельном выпуске
        run: ./scripts/test-install.sh
      # Синхронизация проверяется целиком: два устройства, настоящий сервер,
      # собранные бинарники. Модульные тесты этого не покрывают — они не
      # видят, как части складываются.
      - name: Проверить синхронизацию двух устройств
        run: ./scripts/test-sync.sh
      - name: Проверить скрипты оболочки
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/*.sh
      # Рабочие процессы проверять некому: они запускаются от случая к
      # случаю, а недействительный файл падает мгновенно и молча — так уже
      # случилось с выпуском. actionlint ловит это на pull request.
      - name: Проверить рабочие процессы
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint
        env:
          # Версия закреплена: иначе проверка однажды поменяет мнение сама.
          ACTIONLINT: 1.7.7

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Книги-образцы собираются кодом из тестов эталона, а он тянет pytest.
      - run: pip install pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fb2read build
      - name: Сверить вывод с эталонной реализацией на Python
        run: ./scripts/diff-dump.sh
