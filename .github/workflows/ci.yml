name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # node-pty собирается из исходников, поэтому разрешаем его сборку.
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Сквозные тесты запускают собранный бандл, поэтому сборка идёт раньше.
      - run: pnpm build
      - run: pnpm test

  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fb2read build
      - name: Проверить сборку под Bun
        run: bun packages/cli/dist/fb2read.mjs --version
      - name: Проверить установщик на поддельном выпуске
        run: ./scripts/test-install.sh
      - name: Проверить скрипты оболочки
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -s sh scripts/*.sh
      # Рабочие процессы проверять некому: они запускаются от случая к
      # случаю, а недействительный файл падает мгновенно и молча — так уже
      # случилось с выпуском. actionlint ловит это на pull request.
      - name: Проверить рабочие процессы
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT/actionlint_${ACTIONLINT}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint
        env:
          # Версия закреплена: иначе проверка однажды поменяет мнение сама.
          ACTIONLINT: 1.7.7

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # Книги-образцы собираются кодом из тестов эталона, а он тянет pytest.
      - run: pip install pytest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fb2read build
      - name: Сверить вывод с эталонной реализацией на Python
        run: ./scripts/diff-dump.sh
