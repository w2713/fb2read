name: Выпуск

# Запускается на теге вида v0.12.0. Собирает бинарники под все системы,
# складывает их в релиз вместе с контрольными суммами и публикует пакет
# в npm — второй способ установки для тех, у кого уже есть Node.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  check:
    name: Проверки перед выпуском
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Версия не задаётся: она закреплена в package.json полем packageManager,
      # и указывать её дважды action не позволяет.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Версии в пакетах должны совпадать с тегом
        if: startsWith(github.ref, 'refs/tags/v')
        # Пакетов теперь два, и оба уезжают в npm по одному тегу. Проверять
        # только читалку значит однажды выпустить сервер с чужим числом.
        run: |
          set -eu
          tag="${GITHUB_REF#refs/tags/v}"
          bad=0
          for pkg in cli server; do
            have=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$tag" != "$have" ]; then
              echo "тег v$tag, а в packages/$pkg/package.json $have" >&2
              bad=1
            fi
          done
          [ "$bad" = 0 ]

  binaries:
    name: Бинарники (${{ matrix.host }})
    needs: check
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bun умеет кросс-компиляцию, поэтому Linux и Windows собираются
          # с одной машины. macOS собирается на macOS: там нужна подпись,
          # иначе Apple Silicon откажется запускать скачанное.
          - host: ubuntu-latest
            targets: >-
              linux-x64 linux-arm64 linux-x64-musl linux-arm64-musl
              windows-x64 windows-arm64
              server-linux-x64 server-linux-arm64
              server-linux-x64-musl server-linux-arm64-musl
          - host: macos-latest
            targets: darwin-x64 darwin-arm64
    steps:
      - uses: actions/checkout@v4
      # Версия не задаётся: она закреплена в package.json полем packageManager,
      # и указывать её дважды action не позволяет.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Собрать бинарники
        run: ./scripts/build-binaries.sh "$PWD/release" ${{ matrix.targets }}
      - name: Проверить, что собранное запускается
        # Запустить можно только то, что собрано под эту же машину.
        run: |
          set -eu
          case "${{ matrix.host }}" in
            ubuntu-latest) archive=release/fb2read-linux-x64.tar.gz ;;
            macos-latest) archive=release/fb2read-darwin-arm64.tar.gz ;;
          esac
          tar xzf "$archive" -C release
          ./release/fb2read --version
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.host }}
          path: |
            release/*.tar.gz
            release/*.zip

  release:
    name: Выложить релиз
    needs: binaries
    runs-on: ubuntu-latest
    # Только по тегу. Ручной прогон нужен, чтобы убедиться, что бинарники
    # собираются, — релиз с именем ветки при этом никому не нужен.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          merge-multiple: true
      - name: Собрать контрольные суммы
        run: |
          set -eu
          mkdir -p release
          find downloaded -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv {} release/ \;
          cd release
          for archive in *.tar.gz *.zip; do
            [ -f "$archive" ] || continue
            sha256sum "$archive" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Номер выпуска без буквы v
        id: version
        # В выражениях GitHub нет замены подстроки, поэтому число достаётся
        # оболочкой: из «refs/tags/v0.17.0» нужно «0.17.0».
        run: echo "number=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          # Имя выпуска задаётся здесь, а не руками: иначе оно каждый раз
          # выходит разным — то «v0.16.1», то с опечаткой в названии.
          name: fb2read ${{ steps.version.outputs.number }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  npm:
    name: Опубликовать в npm
    needs: release
    runs-on: ubuntu-latest
    # Публикуется только по настоящему тегу и только если задан токен:
    # без него шаг тихо пропускается, а релиз с бинарниками всё равно выйдет.
    if: startsWith(github.ref, 'refs/tags/v')
    # Секрет в условии `if` подставить нельзя: GitHub отвергает такой файл
    # целиком, и выпуск не начинается вовсе. Переменная задачи в условиях
    # шагов видна — в отличие от переменной самого шага, которая к моменту
    # проверки его `if` ещё не вычислена.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      # Версия не задаётся: она закреплена в package.json полем packageManager,
      # и указывать её дважды action не позволяет.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Публикация читалки
        # Без токена шаг пропускается: релиз с бинарниками выходит всё равно.
        if: env.NPM_TOKEN != ''
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Публикация сервера
        # Отдельный пакет: сервер нужен не всем, и тащить его вместе с
        # читалкой незачем.
        if: env.NPM_TOKEN != ''
        working-directory: packages/server
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
