[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fb2read"
version = "0.11.0"
description = "Читалка книг FB2 и EPUB для терминала"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["fb2", "epub", "ebook", "reader", "curses", "terminal", "tui"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pyte>=0.8"]

[project.scripts]
fb2read = "fb2read:main"

[tool.setuptools]
py-modules = ["fb2read"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
