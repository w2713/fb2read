<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>fb2read</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Панель и списки — один прилипающий блок: порознь они наезжали друг на
         друга, стоило кнопкам перенестись на вторую строку. -->
    <div id="top">
      <header id="bar" hidden>
        <button type="button" id="close" title="Закрыть книгу" aria-label="Закрыть книгу">
          ←
        </button>
        <button type="button" id="toc-toggle">Оглавление</button>
        <button type="button" id="find-toggle">Поиск</button>
        <button type="button" id="marks-toggle">Закладки</button>
        <button type="button" id="mark" title="Поставить закладку" aria-label="Поставить закладку">
          ☆
        </button>
        <!-- Появляется только после перехода по сноске: возвращаться иначе некуда. -->
        <button type="button" id="back" title="Вернуться из сноски" hidden>Назад</button>
        <span id="progress"></span>
        <button type="button" id="theme" title="Сменить тему" aria-label="Сменить тему">
          Тема
        </button>
      </header>

      <div id="panel" hidden>
        <nav id="toc" hidden></nav>

        <section id="find" hidden>
          <form id="find-form">
            <input id="q" type="search" placeholder="Найти в книге" autocomplete="off" />
            <button type="submit">Искать</button>
            <button type="button" id="find-prev" title="Предыдущее совпадение">←</button>
            <button type="button" id="find-next" title="Следующее совпадение">→</button>
          </form>
          <p id="find-count" class="note-line"></p>
          <ul id="found"></ul>
        </section>

        <section id="marks" hidden>
          <p id="marks-empty" class="note-line" hidden>Закладок пока нет.</p>
          <ul id="mark-list"></ul>
          <button type="button" id="marks-export">Выгрузить в markdown</button>
        </section>
      </div>
    </div>

    <main id="app">
      <section id="start">
        <h1>fb2read</h1>
        <p>Читалка книг FB2 и EPUB. Откройте книгу с устройства.</p>
        <label class="pick">
          <input type="file" id="file" accept=".fb2,.fb2.zip,.fbz,.epub,.zip" />
          <span>Выбрать книгу</span>
        </label>
        <p class="hint">Или перетащите файл сюда.</p>
      </section>
      <article id="book" hidden></article>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
